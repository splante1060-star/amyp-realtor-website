<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Page Not Found | Amy Plante Realtor</title>

    <meta
      name="description"
      content="The page you requested could not be found. Return to Amy Plante Realtor for real estate guidance in Massachusetts, Rhode Island, and Florida."
    />

    <meta name="robots" content="noindex, follow" />

    <link rel="icon" type="image/png" href="/amy-plante-social-share.png" />

    <style>
      :root {
        font-family: Arial, Helvetica, sans-serif;
        color: #292724;
        background: #f7f5f0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: radial-gradient(circle at top, #ffffff 0%, #f7f5f0 55%);
      }

      main {
        width: min(680px, 100%);
        text-align: center;
      }

      .logo {
        width: 125px;
        height: 125px;
        margin-bottom: 2rem;
        object-fit: contain;
      }

      .error-code {
        margin: 0 0 0.75rem;
        color: #8f2018;
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.5rem, 7vw, 4.5rem);
        font-weight: 500;
        line-height: 1.05;
      }

      .message {
        max-width: 540px;
        margin: 1.5rem auto 0;
        color: #67635d;
        font-size: 1.05rem;
        line-height: 1.7;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.85rem;
        margin-top: 2rem;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 50px;
        padding: 0.85rem 1.35rem;
        border: 1px solid #8f2018;
        color: #ffffff;
        background: #8f2018;
        font-size: 0.92rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-decoration: none;
      }

      .button.secondary {
        color: #292724;
        background: transparent;
        border-color: #292724;
      }

      .button:hover,
      .button:focus-visible {
        opacity: 0.82;
      }

      .contact {
        margin-top: 2rem;
        color: #67635d;
        font-size: 0.9rem;
      }

      .contact a {
        color: #292724;
      }
    </style>
  </head>

  <body>
    <main>
      <img
        class="logo"
        src="/amy-plante-social-share.png"
        alt="Amy Plante Realtor"
      />

      <p class="error-code">404 · Page not found</p>

      <h1>Let’s get you back on the right path.</h1>

      <p class="message">
        The page you were looking for may have moved, or the address may have
        been entered incorrectly. You can return home or contact Amy directly
        for help.
      </p>

      <div class="actions">
        <a class="button" href="/">Return to the homepage</a>
        <a class="button secondary" href="mailto:amyplanterealtor@gmail.com">
          Email Amy
        </a>
      </div>

      <p class="contact">
        <a href="mailto:amyplanterealtor@gmail.com">
          amyplanterealtor@gmail.com
        </a>
        ·
        <a href="tel:+15089629759">508-962-9759</a>
      </p>
    </main>
  </body>
</html>
